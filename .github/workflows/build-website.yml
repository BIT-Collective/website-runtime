# Wiederverwendbarer Build fuer statische BIT-Websites ("build once, promote").
#
# push auf main   -> baut EIN Image, prueft es, pusht ghcr.io/bit-collective/<repo>:sha-<kurz>
# release         -> baut NICHT neu, sondern haengt an den bereits getesteten sha-Build
#                    zusaetzlich den Release-Tag (vX.Y.Z) — gleicher Digest in allen Ringen.
#
# Aufruf aus einem Website-Repo: siehe templates/new-website-repo/.github/workflows/build.yml
name: build-website

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Pfad zum Dockerfile im aufrufenden Repo
        type: string
        default: Dockerfile
      context:
        description: Build-Kontext
        type: string
        default: .
      smoke-path:
        description: Pfad, der im Production-Modus mit 200 antworten muss
        type: string
        default: /

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image-Namen bestimmen
        id: meta
        run: |
          repo="${GITHUB_REPOSITORY,,}"
          echo "image=ghcr.io/${repo}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bauen (lokal laden, noch nicht pushen)
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          load: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Pruefen
        env:
          IMG: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          SMOKE_PATH: ${{ inputs.smoke-path }}
        run: |
          set -euo pipefail
          # 1) Kein Server-Code im statischen Image (wuerde sonst als Quelltext ausgeliefert).
          if docker run --rm --entrypoint sh "$IMG" -c 'find /srv -name "*.php" | grep -q .'; then
            echo "::error::PHP-Dateien unter /srv im Image"; exit 1
          fi
          # 2) Staging ohne BASIC_AUTH_HASH darf nicht laufen (fail closed).
          docker run -d --name failclosed "$IMG" >/dev/null
          sleep 3
          if [ "$(docker inspect -f '{{.State.Running}}' failclosed)" = "true" ]; then
            echo "::error::Staging laeuft ohne BASIC_AUTH_HASH"; exit 1
          fi
          docker rm -f failclosed >/dev/null
          # 3) Production startet und antwortet.
          docker run -d --name smoke -e SITE_MODE=production -p 8080:80 "$IMG" >/dev/null
          for i in $(seq 1 20); do curl -fs http://127.0.0.1:8080/healthz >/dev/null && break; sleep 1; done
          curl -fs "http://127.0.0.1:8080${SMOKE_PATH}" >/dev/null
          docker rm -f smoke >/dev/null
          echo "Pruefungen bestanden"

      - name: Pushen
        run: docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      - name: Zusammenfassung
        run: |
          echo "### Image gebaut" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"

  promote:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Release-Tag an den getesteten sha-Build haengen (kein Neubau)
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          src="${image}:sha-${GITHUB_SHA::7}"
          dst="${image}:${{ github.event.release.tag_name }}"
          if ! docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
            echo "::error::$src existiert nicht — Release nur von einem Commit erstellen, der auf main gebaut wurde"
            exit 1
          fi
          docker buildx imagetools create --tag "$dst" "$src"
          echo "### Promoted: \`$src\` → \`$dst\`" >> "$GITHUB_STEP_SUMMARY"
